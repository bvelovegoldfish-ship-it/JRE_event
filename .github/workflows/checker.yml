name: JR East Event Checker

on:
  schedule:
    # 4時間おき（UTC時間：0,4,8,12,16,20時 ＝ JST日本時間：9,13,17,21,1,5時）
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch: # GitHubの画面から手動実行ボタンを押せるようにする設定

permissions:
  contents: write # リポジトリへの自動書き込み権限

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python scraper.py

      - name: Commit & Push updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add known_events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update known events" && git push)
